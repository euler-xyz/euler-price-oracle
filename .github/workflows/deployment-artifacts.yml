name: Deployment artifacts up to date

on:
  pull_request:
    paths:
      - "src/**"
      - "foundry.toml"
      - "deployments/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Build both evm_version variants
        run: |
          forge build
          FOUNDRY_OUT=out-paris forge build --evm-version paris

      - name: Regenerate adapters.json
        run: node deployments/generate.mjs

      - name: Fail if committed artifacts are stale (fingerprint-level)
        run: node deployments/check.mjs
