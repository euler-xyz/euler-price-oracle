name: Deployment artifacts up to date

on:
  pull_request:
    paths:
      - "src/**"
      - "lib/**"
      - "foundry.toml"
      - "foundry.lock"
      - "remappings.txt"
      - ".gitmodules"
      - "deployments/**"
      - ".github/workflows/deployment-artifacts.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Build both evm_version variants
        run: |
          forge build
          FOUNDRY_OUT=out-paris forge build --evm-version paris

      # The committed file is never regenerated here: check.mjs verifies it
      # against the fresh compiler output, trusting nothing in the file itself.
      - name: Verify committed artifacts against the build
        run: node deployments/check.mjs
